<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame 3D Shapes</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
    <a-scene>

        <!-- Camera -->
        <a-camera position="0 1.6 4"></a-camera>

        <!-- Lights -->
        <a-light type="directional" position="1 3 2" intensity="0.5"></a-light>
        <a-light type="ambient" intensity="0.4"></a-light>

        <!-- Box -->
        <a-box position="0 1 -3" rotation="0 45 0" color="#737373" animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
        </a-box>

        <!-- Cone -->
        <a-cone position="1.5 1.5 -4" radius-bottom="0.6" height="1.6" color="#630059" animation="property: position; to: 1.5 3 -4; dir: alternate; loop: true; dur: 1200; easing: ease-in-out">
        </a-cone>

        <!-- Triangle -->
        <a-triangle position="-1 1 -3" color="#ff6666" animation="property: rotation; to: 0 360 0; loop: true; dur: 1500">
        </a-triangle>

        <!-- Cylinder -->
        <a-cylinder position="2 1 -3" radius="0.5" height="1.5" color="#800000" animation="property: rotation; to: 0 360 0; loop: true; dur: 1500">
        </a-cylinder>

        <!-- Sphere -->
        <a-sphere position="0 2.5 -3" radius="0.6" color="#009999" animation="property: position; to: 0 3.2 -3; dir: alternate; loop: true; dur: 1200">
        </a-sphere>

        <!-- Plane (Ground) -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#cccccc">
        </a-plane>

    </a-scene>
</body>

</html>
