<!doctype html>
<html>
<head>
<title>A-Frame Geolocation</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

function showShapes(position) {

var currentLatitude = position.coords.latitude;
var currentLongitude = position.coords.longitude;

document.getElementById('currentLocation').innerHTML =
"Latitude: " + currentLatitude + "<br>Longitude: " + currentLongitude;

var locations = [
{ id: "box", lat: 13.00356467, lon: 77.72108384, threshold: 0.01 },
{ id: "cylinder", lat: 13.00356467, lon: 77.72108384, threshold: 0.01 },
{ id: "sphere", lat: 12.9564672, lon: 77.6208384, threshold: 0.01 }
];

locations.forEach(location => {

var shape = document.querySelector(`#${location.id}`);

if (shape) {

var latDiff = Math.abs(currentLatitude - location.lat);
var lonDiff = Math.abs(currentLongitude - location.lon);

if (latDiff < location.threshold && lonDiff < location.threshold) {
shape.setAttribute('visible', true);
} else {
shape.setAttribute('visible', false);
}

}

});

}

function locationError(error) {
document.getElementById('currentLocation').innerHTML =
"Error getting location: " + error.message;
}

if (navigator.geolocation) {
navigator.geolocation.watchPosition(showShapes, locationError,
{ enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
} else {
document.getElementById('currentLocation').innerHTML =
"Geolocation not supported.";
}

});
</script>
</head>

<body>

<h3 id="currentLocation">Fetching location...</h3>

<a-scene>

<a-box id="box" position="0 0.5 -3" color="red" visible="false"></a-box>

<a-cylinder id="cylinder" position="2 0.5 -3" radius="0.5" height="1.5" color="blue" visible="false"></a-cylinder>

<a-sphere id="sphere" position="-2 0.75 -3" radius="0.75" color="green" visible="false"></a-sphere>

<a-camera></a-camera>

</a-scene>

</body>
</html>
